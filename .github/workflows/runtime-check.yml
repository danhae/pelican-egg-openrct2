name: Check OpenRCT2 runtime
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/runtime-check.yml', 'egg-openrct2.json']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check egg installer
        run: |
          python3 - <<'PY'
          import json, pathlib
          egg = json.loads(pathlib.Path('egg-openrct2.json').read_text())
          pathlib.Path('install.sh').write_text(egg['scripts']['installation']['script'])
          PY
          bash -n install.sh
      - name: Install using the egg
        run: |
          mkdir -p test-server
          docker run --rm -e VERSION=v0.5.5 -v "$PWD/test-server:/mnt/server" -v "$PWD/install.sh:/install.sh:ro" debian:trixie-slim bash /install.sh
      - name: Test unmodified runtime as server user
        run: |
          chmod -R a+rX test-server
          docker run --rm --user container --entrypoint /bin/bash -e LD_LIBRARY_PATH=/home/container/OpenRCT2/lib -v "$PWD/test-server:/home/container:ro" ghcr.io/parkervcp/yolks:debian -c '
            set -e
            ldd /home/container/OpenRCT2/openrct2-cli | tee /tmp/dependencies.txt
            if grep -q "not found" /tmp/dependencies.txt; then exit 1; fi
            /home/container/OpenRCT2/openrct2-cli --version
          '
