name: Check OpenRCT2 runtime
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/runtime-check.yml', 'egg-openrct2.json']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect release dependencies in the runtime
        run: |
          mkdir -p test-server
          curl -fL https://github.com/OpenRCT2/OpenRCT2/releases/download/v0.5.5/OpenRCT2-v0.5.5-Linux-trixie-x86_64.tar.gz | tar -xz -C test-server
          docker run --rm --user root --entrypoint /bin/bash -v "$PWD/test-server:/home/container" ghcr.io/parkervcp/yolks:debian -lc '
            export LD_LIBRARY_PATH=/home/container/OpenRCT2/lib
            apt-get update -qq
            apt-get install -y --no-install-recommends libfontconfig1
            ldd /home/container/OpenRCT2/openrct2-cli
            /home/container/OpenRCT2/openrct2-cli --version
          '
